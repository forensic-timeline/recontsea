# Labelling Rules untuk Ground Truth Dataset
# Format:
#   - filter: list of patterns (AND condition - semua pattern harus match)
#   - Pattern matching bersifat case-insensitive

# adapted from AIT V2 Shaw Labelling Rules

# Web Scan
- id: wpscan
  ground_truth_label: wpscan
  sensitivity: moderate
  filter:
    - wpscan

# Dirb Scan
- id: dirb_scan
  ground_truth_label: dirb_scan
  sensitivity: moderate
  filter:
    - "code: 404"
    - "Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)"

# Upload Shell
- id: upload_rce_shell_1
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - "GET / "
    - python

# Upload Shell
- id: upload_rce_shell_2
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - "?p=5"
    - GET
    - python

# Upload Shell
- id: upload_rce_shell_3
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - wp-admin/admin-ajax
    - POST
    - python

# read_profile via Webshell
# cat /etc/profile
- id: read_profile
  ground_truth_label: read_profile
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJjYXQiLCAiL2V0Yy9wcm9maWxlIl0%3D'

# list_web_dir via Webshell
# ls -laR /var/www
- id: list_web_dir
  ground_truth_label: list_web_dir
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJscyIsICItbGFSIiwgIi92YXIvd3d3Il0%3D'

# check_netstat_nat via Webshell
# netstat -nat
- id: check_netstat_nat
  ground_truth_label: check_netstat_nat
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJuZXRzdGF0IiwgIi1uYXQiXQ%3D%3D'

# check_uptime via Webshell
