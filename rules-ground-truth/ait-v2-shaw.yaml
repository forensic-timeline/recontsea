# User Login Activity in Server
- id: login_user
  ground_truth_label: login_user
  sensitivity: moderate
  filter:
    - systemd-logind
    - new session
    - gmarsh

# Sudo Check from Web Directory
- id: check_sudo
  ground_truth_label: check_sudo
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=list

# Sudo List Root from Web Directory
- id: list_root
  ground_truth_label: list_root
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=/bin/ls
    - /root

# Sudo Read Shadow from Web Directory
- id: read_shadow
  ground_truth_label: read_shadow
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=/bin/cat
    - /shadow
