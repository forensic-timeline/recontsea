# Labelling Rules untuk Ground Truth Dataset
# Format:
#   - filter: list of patterns (AND condition - semua pattern harus match)
#   - Pattern matching bersifat case-insensitive

# adapted from AIT V2 Wilson Labelling Rules

# Dirb Scan
- id: dirb_scan
  ground_truth_label: dirb_scan
  sensitivity: moderate
  filter:
    - "code: 404"
    - "Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)"

# Web Scan
- id: wpscan
  ground_truth_label: wpscan
  sensitivity: moderate
  filter:
    - wpscan

# Upload Shell
- id: upload_rce_shell_1
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - "GET / "
    - python

# Upload Shell
- id: upload_rce_shell_2
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - "?p=5"
    - GET
    - python

# Upload Shell
- id: upload_rce_shell_3
  ground_truth_label: upload_rce_shell
  sensitivity: moderate
  filter:
    - wp-admin/admin-ajax
    - POST
    - python

# list_web_dir via Webshell
# ls -laR /var/www
- id: list_web_dir
  ground_truth_label: list_web_dir
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJscyIsICItbGFSIiwgIi92YXIvd3d3Il0%3D'

# check_wp_config via Webshell
# cat /var/www/intranet.hallbrown.wilson.com/wp-config.php
- id: check_wp_config
  ground_truth_label: check_wp_config
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJjYXQiLCAiL3Zhci93d3cvaW50cmFuZXQuaGFsbGJyb3duLndpbHNvbi5jb20vd3AtY29uZmlnLnBocCJd'

# check_whoami via Webshell
# whoami
- id: check_whoami
  ground_truth_label: check_whoami
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJ3aG9hbWkiXQ%3D%3D'

# dump_wp_users via Webshell
# mysql -u wordpress -ptainoox3aedeeSh wordpress_db -e "select * from wp_users"
- id: dump_wp_users
  ground_truth_label: dump_wp_users
  sensitivity: moderate
  filter:
    - 'wp_meta=WyJteXNxbCIsICItdSIsICJ3b3JkcHJlc3MiLCAiLXB0YWlub294M2FlZGVlU2giLCAid29yZHByZXNzX2RiIiwgIi1lIiwgIlwic2VsZWN0ICogZnJvbSB3cF91c2Vyc1wiIl0%3D'

