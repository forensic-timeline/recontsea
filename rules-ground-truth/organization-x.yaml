# Labelling Rules untuk Ground Truth Dataset
# Format:
#   - filter: list of patterns (AND condition - semua pattern harus match)
#   - Pattern matching bersifat case-insensitive

# Organization X Labelling Rules, adapted from SEC Paper

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: moderate
  filter:
    - "code: 404"
    - "Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 5.1; Trident/4.0)"

- id: dir_scan
  ground_truth_label: dir_scan_go
  sensitivity: moderate
  filter:
    - "Go-http-client"

- id: dir_scan
  ground_truth_label: dir_scan_python
  sensitivity: moderate
  filter:
    - "code: 302"
    - "python"

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: strict
  filter:
    - "%Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    - "%POST%"
    - "%400%"

- id: dir_scan
  ground_truth_label: dir_scan
  sensitivity: strict
  filter:
    - "%Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    - "%GET%"
    - "%302%"

