title: User Deletion Activity
id: 72dddb3e-4ee2-4ef5-a6cc-9a11db3c4f1d
status: test
description: Detects user or group deletion activity based on logs generated by userdel on Linux systems.
author: Converted based on sample event
tags:
  - userdel
  - privilege-escalation
  - account-modification
  - keyword-detection

logsource:
  category: sshd
  product: linux

detection:
  keywords:
    - 'removed shadow group'
    - 'delete user'
    - 'deleted user'
    - 'remove user'
    - 'removed user'
  condition: keywords

falsepositives:
  - Legitimate system administration tasks
  - Account lifecycle cleanup
level: high
