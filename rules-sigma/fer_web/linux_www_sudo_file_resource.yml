title: Sudo File Resource Command Executed from Web Directory
id: 67e1c3c9-8f4b-4af7-9c4d-6fd3fdc5f7c4
status: test
description: Detects sudo file resource command execution originating from /var/www (apache/nginx) or tmp/lscpd (openlite/cyberpanel), which may indicate privilege escalation from a compromised web process.
author: Converted based on sample event
tags:
  - sudo
  - privilege-escalation
  - webshell
  - keyword-detection

logsource:
  category: sshd
  product: linux

detection:
  selection_base:
    CommandLine|contains:
      - 'var/www'
      - 'tmp/lscpd'
  selection_command:
    CommandLine|contains:
      - 'mkdir'
      - 'touch'
      - 'wget'
      - 'tar'
      - 'zip'
      - '7z'
      - 'rar'
      - 'bin/cp'
  condition: selection_base and selection_command

falsepositives:
  - Legitimate maintenance or deployment script activity
  - Admin debugging or upgrade operations
level: critical
